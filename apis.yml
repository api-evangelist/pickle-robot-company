name: Pickle Robot Company
description: >-
  Pickle Robot Company builds Physical AI robots for supply chain automation,
  focused on autonomously unloading non-palletized goods (floor-loaded boxes and
  parcels) from trucks and shipping containers at warehouse speed. Its Dill
  Autonomy Engine (DAE) combines classical optimal control with generative AI and
  machine vision so fleets improve continuously across deployments, with
  operational dashboards reporting picks-per-hour, unload times, and package-mix
  analysis. Customers include UPS and Cintas. Headquartered in the Boston,
  Massachusetts area, Pickle Robot is a DCVC portfolio company backed by investors
  including Teradyne Robotics Ventures, Toyota Ventures, Catapult Ventures,
  Hyperplane, and VersionOne. The company publishes no public developer API,
  documentation portal, or SDK; its GitHub organization hosts robotics tooling
  (mostly ROS/SLAM forks) rather than API client libraries.
